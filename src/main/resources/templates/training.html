<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Обучающая программа</title>
    <link rel="stylesheet" th:href="@{/css/training.css}">
</head>
<body>

<aside class="quiz__navigation">
    <a href="#"
       class="quiz__link"
       th:each="i : ${#numbers.sequence(1, questionCount)}"
       th:classappend="${i == currentQuestion} ? 'active'">
        <span th:text="|Вопрос ${i}|"></span>
    </a>
</aside>
<div class="quiz__content">
    <div class="quiz__header">
        <h1>Сборник вопросов по курсу "Эксплуатация электроустановок непромышленных потребителей (IV группа до 1000 В)"</h1>
    </div>
    <p class="quiz__label">Текст вопроса</p>
    <div th:text="|Вопрос ${currentQuestion}: ${question}|" class="quiz__question-text">Вопрос</div>
    <p class="quiz__label">Варианты ответов</p>
    <form action="#" class="quiz-form">
        <div class="quiz-form__answers">
            <div class="quiz-form__row">
                <input type="checkbox" id="answer1">
                <label for="answer1">Ответ</label>
            </div>
        </div>
        <div class="quiz-form__actions">
            <button type="submit" class="quiz-form__button">Ответить</button>
        </div>
    </form>
</div>

</body>
</html>
