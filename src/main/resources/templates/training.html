<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Обучающая программа</title>
    <link rel="stylesheet" th:href="@{/css/training.css}">
</head>
<body>

<div class="content-container">
    <aside class="questions">
        <a href="#"
           th:each="i : ${#numbers.sequence(1, questionsAmount)}"
           th:text="|Вопрос ${i}|">
        </a>
    </aside>
    <div class="right-container">
        <div class="section">
            <h1>Сборник вопросов по курсу "Эксплуатация электроустановок непромышленных потребителей (IV группа до 1000 В)"</h1>
        </div>
        <p>Текст вопроса</p>
        <div class="question" th:text="|Вопрос ${questionNumber}: ${question}|">

        </div>
        <p>Варианты ответов</p>
        <div class="form-container">
            <form action="#" class="form">
                <div class="answers-container">
                    <div class="form-row">
                        <input type="checkbox" id="answer1">
                        <label for="answer1">
                            Ответ
                        </label>
                    </div>
                </div>
                <div class="button-container">
                    <button type="submit">Ответить</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
